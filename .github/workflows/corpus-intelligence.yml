name: NOVA Corpus Intelligence Gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install focused test dependency
        run: python -m pip install pytest
      - name: Compile intelligence helpers
        run: python -m py_compile tools/corpus_intelligence.py
      - name: Validate research index
        run: python tools/corpus_intelligence.py | tee nova-corpus-validation.json
      - name: Run evidence and continuity tests
        run: python -m pytest -q tests/test_corpus_intelligence.py
      - uses: actions/upload-artifact@v4
        with:
          name: nova-corpus-validation
          path: nova-corpus-validation.json
          if-no-files-found: error
